[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maestro"
version = "0.1.0"
description = "Watch a GitHub Projects board and dispatch coding agents to work issues."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "types-PyYAML>=6.0",
]

[project.scripts]
maestro = "maestro.cli:main"

[tool.setuptools.packages.find]
include = ["maestro*"]

# Bundle the non-.py reference templates (worker skill, CI skeleton, example
# config) into the wheel so they ship inside the installed package and `maestro
# update` / `doctor` can resolve them via importlib.resources after a plain
# `uv tool install`. Without this, only `maestro*.py` modules land in the wheel.
[tool.setuptools.package-data]
maestro = ["templates/*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "UP", "B", "SIM"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
