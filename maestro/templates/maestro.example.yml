# Maestro configuration. Copy this file to maestro.yml at the root of the
# repository Maestro should drive, then edit. Maestro is run from inside that
# repo and infers the repo path from the git root, so this file holds only board
# facts (no machine-specific paths) and is meant to be committed to the repo.
# Runtime artifacts live in a sibling <repo>.maestro/ dir, never in the repo.

# --- Required ---

# GitHub "owner/name" slug for the repository this config lives in.
repo_slug: "your-org/your-project"

# GitHub Projects V2 board number to poll.
project_number: 1

# Status-field value that means "dispatch this issue".
trigger_column: "In Progress"

# --- Optional (defaults shown) ---

# Status-field value a worker parks its card in when it opens its PR.
# Reaching this column is how Maestro classifies a run as "done".
review_column: "In Review"

# Status-field value a worker parks its card in when it cannot proceed.
# Reaching this column is how Maestro classifies a run as "blocked".
blocked_column: "Blocked"

# Hard ceiling on simultaneously running workers. Each worker is heavy.
max_concurrent: 2

# Seconds between board polls.
poll_interval: 60

# How many times an issue may fail in a row before Maestro stops dispatching it.
# A "failure" is a run that ends without the worker parking its card in the
# review or blocked column (a crash or contract violation); any clean run resets
# the streak. The streak is derived from runs.jsonl, so it survives a restart.
# This guards against a stuck issue redispatching forever -- each retry is a full
# worker session. A capped issue is flagged in `maestro status` and logged; clear
# it by fixing the issue and moving its card out of and back into the trigger
# column. Must be a positive integer.
max_consecutive_failures: 3

# Prompt handed to each worker. Must contain the {issue} placeholder.
worker_prompt: "/cc-work {issue}"

# Colour theme for `maestro status`. Built in: nord, dark, light.
theme: "nord"

# Shell command run inside each fresh worktree to provision its environment
# (typically an isolated virtualenv). When unset, the repo's .venv is symlinked
# in instead -- but that venv's editable install points back at the primary
# checkout, so a worker's tests would run against the wrong code. Set this for
# any repo whose workers change Python code. Example (requires uv):
# worktree_setup: "uv venv .venv && uv pip install -e '.[dev]'"

# Whether `maestro setup` materializes the optional CI workflow skeleton into
# .github/workflows/maestro-ci.yml (you then commit it). CI is not required:
# workers open and rework PRs with or without it. Its only payoff is giving the
# worker an automated rework signal (failed checks) on top of human review. The
# shipped skeleton is manual-only (workflow_dispatch) until you wire in a real
# test command, so leave this off until you have one -- an unconfigured pipeline
# either lies green or reds every PR, and both poison the rework signal.
manage_ci: false
